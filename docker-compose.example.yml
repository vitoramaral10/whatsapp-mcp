# Example deployment. Copy to docker-compose.yml, then: mkdir -p store && sudo chown 1000:1000 store
services:
  whatsapp-mcp:
    build: .
    image: whatsapp-mcp
    tty: true # the QR code on first start
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000" # MCP; no authentication, keep it on localhost
    volumes:
      - ./store:/app/whatsapp-bridge/store
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
